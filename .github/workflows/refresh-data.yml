# Refreshes ratings, review counts, opening hours and phone numbers on existing
# listings from Google Places, then commits any changes (Vercel deploys the push).
# It never adds or removes listings and never changes descriptions.
name: Refresh listing data

on:
  schedule:
    - cron: '0 3 1,15 * *'   # 05:00 SAST on the 1st and 15th of each month
  workflow_dispatch:
    inputs:
      limit:
        description: 'Only refresh the first N listings (0 = all)'
        default: '0'
      dry_run:
        description: 'Report what would change without committing'
        type: boolean
        default: false

permissions:
  contents: write

concurrency: refresh-data

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Refresh listings from Google Places
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          LIMIT: ${{ inputs.limit }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          case "$LIMIT" in ''|*[!0-9]*) LIMIT=0 ;; esac
          ARGS=""
          [ "$LIMIT" != "0" ] && ARGS="$ARGS --limit $LIMIT"
          [ "$DRY_RUN" = "true" ] && ARGS="$ARGS --dry-run"
          python scraper/refresh.py $ARGS

      - name: Commit changes
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "Rob Louw"
          git config user.email "robertjameslouw@gmail.com"
          git add data/restaurants
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Refresh listing data from Google Places"
            git push
          fi
